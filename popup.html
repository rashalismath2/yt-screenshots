<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Screenshot Library</title>
  <style>
    body{font-family:system-ui,sans-serif;width:290px;margin:0;padding:16px;background:#111;color:#fff}
    h1{font-size:16px;margin:0 0 10px} p{font-size:13px;line-height:1.45;color:#cfcfcf}
    kbd{background:#2c2c2c;border:1px solid #555;border-radius:5px;padding:2px 7px;color:#fff}
    button{width:100%;border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer;background:#fff;color:#111;margin-top:8px}
  </style>
</head>
<body>
  <h1>YouTube Screenshot Library</h1>
  <p>While watching YouTube, press <kbd>P</kbd> to capture the visible video frame as a JPEG.</p>
  <button id="gallery">Open Screenshot Gallery</button>
  <script src="popup.js"></script>
</body>
</html>
